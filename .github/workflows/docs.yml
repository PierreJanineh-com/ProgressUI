name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build DocC
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate documentation
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation \
            --target ProgressUI \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path ProgressUI \
            --output-path ./docs

      # DocC has no landing page at the site root, so the bare Pages URL renders
      # "page can't be found". Redirect the root to the module's documentation.
      - name: Redirect site root to the module documentation
        run: |
          cat > ./docs/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>ProgressUI</title>
              <meta http-equiv="refresh" content="0; url=documentation/progressui">
              <link rel="canonical" href="documentation/progressui">
            </head>
            <body>
              Redirecting to the <a href="documentation/progressui">ProgressUI documentation</a>…
            </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
